# SPDX-License-Identifier: MIT
# XPrism CI: Linux (full build and test suite, with the built-in compositor
# off and on), FreeBSD and OpenBSD (build and unit tests). The upstream XLibre workflows are disabled in this repo;
# this one reuses their package and build scripts.
name: XPrism CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    MESON_BUILDDIR:  "__BUILD"
    X11_PREFIX:      /home/runner/x11
    X11_BUILD_DIR:   /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/WORK/sources/3rdparty
    GOXPROTO_REF:    v0.0.8

jobs:
    linux:
        # compositor: the whole suite, including XTS, once with the
        # built-in compositor off and once with it on by default
        name: linux (compositor ${{ matrix.compositor }})
        strategy:
            fail-fast: false
            matrix:
                compositor: [off, on]
        runs-on: ubuntu-latest
        timeout-minutes: 120
        env:
            MESON_ARGS: -Dprefix=/usr -Dxephyr=true -Dwerror=true -Dxorg=true -Dxvfb=true -Dxfbdev=true -Dtest_xephyr_gles=true -Dcompositor_default=${{ matrix.compositor == 'on' }}
            LIBGL_ALWAYS_SOFTWARE: 1
            GALLIUM_DRIVER: llvmpipe
            PIGLIT_PLATFORM: x11_egl
        steps:
            - uses: actions/checkout@v6

            - uses: ./.github/actions/ubuntu-install-pkg

            - name: prepare build environment
              run: |
                MACHINE=`gcc -dumpmachine`
                echo "PKG_CONFIG_PATH=$X11_PREFIX/share/pkgconfig:$X11_PREFIX/lib/$MACHINE/pkgconfig:$X11_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

            - name: X11 prereq cache
              uses: actions/cache@v5
              with:
                path: |
                    ${{ env.X11_PREFIX }}
                    ${{ env.X11_BUILD_DIR }}/xts
                    ${{ env.X11_BUILD_DIR }}/piglit
                    ${{ env.X11_BUILD_DIR }}/goxproto
                key: ${{ runner.name }}-x11-deps-${{ hashFiles('.github/scripts/ubuntu/install-prereq.sh') }}
                restore-keys: ${{ runner.name }}-x11-deps-

            # A virtual KMS device on a seat of its own for test_kms.py,
            # which drives it with the modesetting driver. If the runner's
            # kernel has no vkms, those tests are skipped.
            - name: virtual display device (vkms)
              continue-on-error: true
              run: |
                sudo mkdir -p /run/udev/rules.d
                echo 'SUBSYSTEM=="drm", DEVPATH=="*/vkms/*", ENV{ID_SEAT}="seat-vkms"' | sudo tee /run/udev/rules.d/99-vkms.rules
                sudo udevadm control --reload
                sudo modprobe vkms || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe vkms; }
                sudo udevadm settle
                sudo chmod 0666 /dev/dri/card*
                ls -l /dev/dri
                for c in /sys/class/drm/card[0-9]; do udevadm info "$c" | grep -E "DEVPATH|ID_SEAT"; done

            - name: build and test
              run: .github/scripts/ubuntu/run-xserver-build-and-test.sh

            - name: archive build logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: linux-compositor-${{ matrix.compositor }}-build-logs
                  path: |
                      __BUILD/meson-logs/*
                      __BUILD/test/piglit-results/*/summary
                      __BUILD/test/piglit-results/*/long-summary

    freebsd:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        env:
            MESON_ARGS: -Dprefix=/usr -Dwerror=true -Dxorg=true -Dxvfb=true -Dxephyr=false -Dxfbdev=false
            CFLAGS: -Wno-typedef-redefinition
        steps:
            - uses: actions/checkout@v6
            - uses: vmactions/freebsd-vm@v1
              with:
                  envs: 'MESON_ARGS CFLAGS'
                  usesh: true
                  release: "14.3"
                  run: ./.github/scripts/xprism/bsd-build-and-unit-test.sh freebsd

    openbsd:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        env:
            MESON_ARGS: -Dwerror=true -Dxvfb=true -Dxorg=false -Dxephyr=false -Dxfbdev=false -Ddri2=false -Ddri3=false
        steps:
            - uses: actions/checkout@v6
            - uses: vmactions/openbsd-vm@v1
              with:
                  envs: 'MESON_ARGS'
                  usesh: true
                  run: ./.github/scripts/xprism/bsd-build-and-unit-test.sh openbsd
